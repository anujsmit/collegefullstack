<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>To-Do List Manager</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f1f5f9;--surface:#fff;--text:#0f172a;--muted:#64748b;--line:#e2e8f0;
  --primary:#2563eb;--primary-d:#1d4ed8;--green:#10b981;--amber:#f59e0b;--red:#dc2626;
}
html{-webkit-text-size-adjust:100%}
body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;background:var(--bg);color:var(--text);padding:24px 16px 48px;line-height:1.5;min-height:100vh}
.container{width:100%;max-width:960px;margin:0 auto}
:focus-visible{outline:3px solid rgba(37,99,235,.45);outline-offset:2px}

/* Header */
.app-header{text-align:center;margin-bottom:28px}
.app-header h1{font-size:2rem;font-weight:700;letter-spacing:-.02em;color:#1e293b;margin-bottom:6px}
.app-header p{color:var(--muted)}

/* Toast (fixed, so the page never jumps) */
.alert{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:2000;max-width:calc(100% - 32px);padding:12px 20px;border-radius:12px;font-size:.92rem;font-weight:500;border:1px solid transparent;box-shadow:0 10px 25px -8px rgba(0,0,0,.2);transition:opacity .2s,transform .2s}
.alert-success{background:#f0fdf4;color:#166534;border-color:#bbf7d0}
.alert-error{background:#fef2f2;color:#991b1b;border-color:#fecaca}
.hidden{display:none!important}

/* Stats */
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:24px}
.stat-card{background:var(--surface);border-radius:14px;padding:18px;border-left:5px solid var(--primary);box-shadow:0 1px 3px rgba(15,23,42,.06)}
.stat-card.stat-completed{border-left-color:var(--green)}
.stat-card.stat-pending{border-left-color:var(--amber)}
.stat-card h3{font-size:.82rem;font-weight:600;color:var(--muted);margin-bottom:4px}
.stat-card span{display:block;font-size:2rem;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums}

/* Cards */
.card{background:var(--surface);border-radius:16px;padding:24px;margin-bottom:24px;box-shadow:0 1px 3px rgba(15,23,42,.06)}
.card h2{font-size:1.2rem;font-weight:600}
.card-header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px;padding-bottom:12px;border-bottom:1px solid var(--line)}

/* Forms */
.form-group{margin-bottom:16px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
label{display:block;font-size:.85rem;font-weight:600;color:#334155;margin-bottom:6px}
input[type=text],input[type=date],select,textarea{width:100%;padding:10px 12px;border:1px solid #cbd5e1;border-radius:10px;font:inherit;font-size:.95rem;background:#fff;color:var(--text);transition:border-color .15s,box-shadow .15s}
input[type=text]:focus,input[type=date]:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.18)}
textarea{resize:vertical;min-height:72px}

/* Buttons */
.btn{padding:10px 20px;border-radius:10px;border:1px solid transparent;font:inherit;font-weight:600;font-size:.9rem;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;line-height:1.2;transition:background .15s,border-color .15s}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-d)}
.btn-secondary{background:#fff;color:#334155;border-color:#cbd5e1}
.btn-secondary:hover{background:#f8fafc}
.btn-edit,.btn-delete{padding:6px 12px;font-size:.82rem}
.btn-edit{background:#eff6ff;color:var(--primary-d)}
.btn-edit:hover{background:#dbeafe}
.btn-delete{background:#fef2f2;color:#b91c1c}
.btn-delete:hover{background:#fee2e2}
.actions{display:flex;gap:8px;white-space:nowrap}

/* Table */
.table-responsive{overflow-x:auto}
.task-table{width:100%;border-collapse:collapse;font-size:.95rem;min-width:620px}
.task-table th{text-align:left;padding:10px 12px;color:var(--muted);font-weight:600;font-size:.82rem;border-bottom:1px solid var(--line);white-space:nowrap}
.task-table td{padding:14px 12px;border-bottom:1px solid #f1f5f9;vertical-align:top}
.task-table tr:last-child td{border-bottom:none}
.col-status{width:56px;text-align:center!important}
.col-status input{margin:2px auto 0}
.col-actions{width:1%}
.task-title{font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.task-desc{font-size:.85rem;color:var(--muted);margin-top:2px;max-width:340px;overflow-wrap:anywhere}
.task-completed .task-title{text-decoration:line-through;color:#94a3b8}
.task-completed .task-desc{color:#a3aebf}
.task-completed .badge{opacity:.55}
.due{white-space:nowrap}
.due.overdue{color:var(--red);font-weight:600}
.due small{display:block;font-weight:500;font-size:.75rem}
.dash{color:#94a3b8}

/* Badges */
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.78rem;font-weight:600;white-space:nowrap}
.badge-high{background:#fee2e2;color:#b91c1c}
.badge-medium{background:#fef3c7;color:#b45309}
.badge-low{background:#dcfce7;color:#15803d}

input[type=checkbox]{width:20px;height:20px;cursor:pointer;accent-color:var(--primary);display:block}

.no-tasks{text-align:center;padding:36px 20px;color:var(--muted);border-radius:12px;border:1px dashed #cbd5e1;margin-top:8px}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(15,23,42,.5);display:flex;justify-content:center;align-items:center;z-index:1000;padding:16px}
.modal-content{background:#fff;border-radius:18px;width:100%;max-width:520px;padding:24px;box-shadow:0 30px 50px -12px rgba(0,0,0,.3);max-height:90vh;overflow-y:auto}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.modal-header h3{font-size:1.25rem;font-weight:600}
.close-btn{background:none;border:none;font-size:1.8rem;line-height:1;cursor:pointer;color:var(--muted);padding:2px 8px;border-radius:8px}
.close-btn:hover{color:var(--text);background:#f1f5f9}
.modal-actions{display:flex;justify-content:flex-end;gap:12px;margin-top:20px}

@media (max-width:640px){
  body{padding:16px 12px 40px}
  .app-header h1{font-size:1.6rem}
  .stats-row{grid-template-columns:1fr;gap:10px}
  .stat-card{display:flex;justify-content:space-between;align-items:center;padding:14px 16px}
  .stat-card h3{margin:0}
  .stat-card span{font-size:1.6rem}
  .form-row{grid-template-columns:1fr;gap:0}
  .card{padding:18px 16px}
  .modal-content{padding:20px 16px}
  .modal-actions{flex-direction:column-reverse}
  .modal-actions .btn{width:100%}
  .card-header .btn{padding:9px 14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="container">
  <header class="app-header">
    <h1>To-Do List Manager</h1>
    <p>Add, edit and track your tasks.</p>
  </header>

  <div id="alertBox" class="alert hidden" role="status" aria-live="polite"></div>

  <div class="stats-row">
    <div class="stat-card"><h3>Total tasks</h3><span id="totalTasks">0</span></div>
    <div class="stat-card stat-completed"><h3>Completed</h3><span id="completedTasks">0</span></div>
    <div class="stat-card stat-pending"><h3>Pending</h3><span id="pendingTasks">0</span></div>
  </div>

  <section class="card">
    <div class="card-header">
      <h2>All tasks</h2>
      <button type="button" class="btn btn-primary" onclick="openAddModal()">+ Add task</button>
    </div>
    <div class="table-responsive">
      <table class="task-table">
        <thead>
          <tr>
            <th class="col-status">Done</th>
            <th>Task</th>
            <th>Priority</th>
            <th>Due</th>
            <th class="col-actions">Actions</th>
          </tr>
        </thead>
        <tbody id="taskTableBody"></tbody>
      </table>
    </div>
    <div id="noTasksMsg" class="no-tasks hidden">No tasks yet. Add your first one above.</div>
  </section>
</div>

<div id="addModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="addHeading">
  <div class="modal-content">
    <div class="modal-header">
      <h3 id="addHeading">Add a task</h3>
      <button type="button" class="close-btn" aria-label="Close" onclick="closeAddModal()">&times;</button>
    </div>
    <form id="taskForm">
      <div class="form-group">
        <label for="title">Title *</label>
        <input type="text" id="title" placeholder="e.g., Finish project proposal" required>
      </div>
      <div class="form-group">
        <label for="description">Description</label>
        <textarea id="description" rows="2" placeholder="Optional details"></textarea>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="priority">Priority</label>
          <select id="priority">
            <option value="Low">Low</option>
            <option value="Medium" selected>Medium</option>
            <option value="High">High</option>
          </select>
        </div>
        <div class="form-group">
          <label for="dueDate">Due date</label>
          <input type="date" id="dueDate">
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" onclick="closeAddModal()">Cancel</button>
        <button type="submit" class="btn btn-primary">Add task</button>
      </div>
    </form>
  </div>
</div>

<div id="editModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="editHeading">
  <div class="modal-content">
    <div class="modal-header">
      <h3 id="editHeading">Edit task</h3>
      <button type="button" class="close-btn" aria-label="Close" onclick="closeEditModal()">&times;</button>
    </div>
    <form id="editForm">
      <input type="hidden" id="editId">
      <div class="form-group">
        <label for="editTitle">Title *</label>
        <input type="text" id="editTitle" required>
      </div>
      <div class="form-group">
        <label for="editDescription">Description</label>
        <textarea id="editDescription" rows="2"></textarea>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="editPriority">Priority</label>
          <select id="editPriority">
            <option value="Low">Low</option>
            <option value="Medium">Medium</option>
            <option value="High">High</option>
          </select>
        </div>
        <div class="form-group">
          <label for="editDueDate">Due date</label>
          <input type="date" id="editDueDate">
        </div>
      </div>
      <div class="form-group">
        <label for="editStatus">Status</label>
        <select id="editStatus">
          <option value="Pending">Pending</option>
          <option value="Completed">Completed</option>
        </select>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" onclick="closeEditModal()">Cancel</button>
        <button type="submit" class="btn btn-primary">Save changes</button>
      </div>
    </form>
  </div>
</div>

<script>
const API_URL = '/api/tasks';

const taskTableBody = document.getElementById('taskTableBody');
const noTasksMsg = document.getElementById('noTasksMsg');
const taskForm = document.getElementById('taskForm');
const editModal = document.getElementById('editModal');
const addModal = document.getElementById('addModal');
const editForm = document.getElementById('editForm');
const alertBox = document.getElementById('alertBox');
const totalTasksEl = document.getElementById('totalTasks');
const completedTasksEl = document.getElementById('completedTasks');
const pendingTasksEl = document.getElementById('pendingTasks');

let allTasks = [];
let alertTimer;

document.addEventListener('DOMContentLoaded', () => {
  loadTasks();
  taskForm.addEventListener('submit', createTask);
  editForm.addEventListener('submit', updateTask);
  // Close modal on backdrop click or Escape
  editModal.addEventListener('mousedown', e => { if (e.target === editModal) closeEditModal(); });
  addModal.addEventListener('mousedown', e => { if (e.target === addModal) closeAddModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeEditModal(); closeAddModal(); } });
});

// ---- Date helpers: MySQL often returns ISO timestamps, which break <input type="date"> ----
function toDateValue(d) {
  if (!d) return '';
  return String(d).slice(0, 10); // YYYY-MM-DD
}
function formatDue(d, completed) {
  const v = toDateValue(d);
  if (!v) return '<span class="dash">—</span>';
  const [y, m, day] = v.split('-').map(Number);
  const date = new Date(y, m - 1, day);
  const label = date.toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const overdue = !completed && date < today;
  return `<span class="due${overdue ? ' overdue' : ''}">${label}${overdue ? '<small>Overdue</small>' : ''}</span>`;
}

async function loadTasks() {
  try {
    const response = await fetch(API_URL);
    if (!response.ok) throw new Error('Failed to load tasks');
    allTasks = await response.json();
    renderTasks(allTasks);
    updateStats(allTasks);
  } catch (error) {
    console.error('Error:', error);
    showAlert('Could not load tasks. Check that the server is running.', 'error');
  }
}

function renderTasks(tasks) {
  taskTableBody.innerHTML = '';
  if (tasks.length === 0) { noTasksMsg.classList.remove('hidden'); return; }
  noTasksMsg.classList.add('hidden');

  tasks.forEach(task => {
    const tr = document.createElement('tr');
    const isCompleted = task.status === 'Completed';
    if (isCompleted) tr.classList.add('task-completed');
    const priority = task.priority || 'Medium';

    tr.innerHTML = `
      <td class="col-status">
        <input type="checkbox" ${isCompleted ? 'checked' : ''}
          onchange="toggleStatus(${task.id}, '${task.status}')"
          aria-label="Mark as ${isCompleted ? 'pending' : 'completed'}"
          title="Mark as ${isCompleted ? 'pending' : 'completed'}">
      </td>
      <td>
        <div class="task-title">${escapeHTML(task.title)}</div>
        ${task.description ? `<div class="task-desc">${escapeHTML(task.description)}</div>` : ''}
      </td>
      <td><span class="badge badge-${escapeHTML(priority.toLowerCase())}">${escapeHTML(priority)}</span></td>
      <td>${formatDue(task.due_date, isCompleted)}</td>
      <td class="col-actions">
        <div class="actions">
          <button class="btn btn-edit" onclick="openEditModal(${task.id})">Edit</button>
          <button class="btn btn-delete" onclick="deleteTask(${task.id})">Delete</button>
        </div>
      </td>`;
    taskTableBody.appendChild(tr);
  });
}

function updateStats(tasks) {
  const total = tasks.length;
  const completed = tasks.filter(t => t.status === 'Completed').length;
  totalTasksEl.textContent = total;
  completedTasksEl.textContent = completed;
  pendingTasksEl.textContent = total - completed;
}

async function createTask(e) {
  e.preventDefault();
  const title = document.getElementById('title').value.trim();
  const description = document.getElementById('description').value.trim();
  const priority = document.getElementById('priority').value;
  const due_date = document.getElementById('dueDate').value;

  if (!title) { showAlert('Enter a task title.', 'error'); return; }

  try {
    const response = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title, description: description || null, priority, due_date: due_date || null })
    });
    if (!response.ok) throw new Error('Failed to create task');
    taskForm.reset();
    closeAddModal();
    showAlert('Task added.', 'success');
    loadTasks();
  } catch (error) {
    console.error('Error:', error);
    showAlert('Couldn’t add the task. Try again.', 'error');
  }
}

function openEditModal(id) {
  const task = allTasks.find(t => t.id === id);
  if (!task) return;
  document.getElementById('editId').value = task.id;
  document.getElementById('editTitle').value = task.title;
  document.getElementById('editDescription').value = task.description || '';
  document.getElementById('editPriority').value = task.priority;
  document.getElementById('editDueDate').value = toDateValue(task.due_date);
  document.getElementById('editStatus').value = task.status;
  editModal.classList.remove('hidden');
  document.getElementById('editTitle').focus();
}

function closeEditModal() { editModal.classList.add('hidden'); }

function openAddModal() {
  taskForm.reset();
  addModal.classList.remove('hidden');
  document.getElementById('title').focus();
}
function closeAddModal() { addModal.classList.add('hidden'); }

async function updateTask(e) {
  e.preventDefault();
  const id = document.getElementById('editId').value;
  const title = document.getElementById('editTitle').value.trim();
  const description = document.getElementById('editDescription').value.trim();
  const priority = document.getElementById('editPriority').value;
  const due_date = document.getElementById('editDueDate').value;
  const status = document.getElementById('editStatus').value;

  if (!title) { showAlert('A title is required.', 'error'); return; }

  try {
    const response = await fetch(`${API_URL}/${id}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title, description: description || null, priority, due_date: due_date || null, status })
    });
    if (!response.ok) throw new Error('Failed to update task');
    closeEditModal();
    showAlert('Changes saved.', 'success');
    loadTasks();
  } catch (error) {
    console.error('Error:', error);
    showAlert('Couldn’t save your changes. Try again.', 'error');
  }
}

async function toggleStatus(id, currentStatus) {
  const newStatus = currentStatus === 'Completed' ? 'Pending' : 'Completed';
  try {
    const response = await fetch(`${API_URL}/${id}/status`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status: newStatus })
    });
    if (!response.ok) throw new Error('Failed to update status');
    showAlert(`Marked as ${newStatus.toLowerCase()}.`, 'success');
    loadTasks();
  } catch (error) {
    console.error('Error:', error);
    showAlert('Couldn’t update the status. Try again.', 'error');
    loadTasks(); // reset the checkbox to the real state
  }
}

async function deleteTask(id) {
  if (!confirm('Delete this task permanently?')) return;
  try {
    const response = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
    if (!response.ok) throw new Error('Failed to delete task');
    showAlert('Task deleted.', 'success');
    loadTasks();
  } catch (error) {
    console.error('Error:', error);
    showAlert('Couldn’t delete the task. Try again.', 'error');
  }
}

function showAlert(message, type = 'success') {
  clearTimeout(alertTimer);
  alertBox.textContent = message;
  alertBox.className = `alert alert-${type}`;
  alertTimer = setTimeout(() => alertBox.classList.add('hidden'), 3000);
}

function escapeHTML(str) {
  if (!str) return '';
  return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
}
</script>
</body>
</html>
